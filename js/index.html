<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.plot.ly; style-src 'self' 'unsafe-inline';">
  <title>Analyse Spectrophotométrique LCR</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plot.ly/plotly-2.29.0.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Analyse Xanthochromie LCR</h1>
      <button id="btn-load">Charger un fichier spectro</button>
      <span id="file-name">Aucun fichier sélectionné</span>
    </header>
    
    <div class="controls-panel">
      <div class="radio-group">
        <label><input type="radio" name="calc-mode" value="auto" checked> Tangente Automatique</label>
        <label><input type="radio" name="calc-mode" value="manual"> Tangente Manuelle</label>
      </div>
      <div id="manual-inputs" style="display: none;">
        <label>Lambda Gauche: <input type="number" id="manual-left" value="380" min="350" max="600"></label>
        <label>Lambda Droit: <input type="number" id="manual-right" value="500" min="400" max="750"></label>
      </div>
    </div>

    <!-- Zone d'alertes qualité -->
    <div id="warnings-box" class="warnings-box" style="display: none;">
      <h4 style="margin-top:0;">⚠️ Avertissements qualité :</h4>
      <ul id="warnings-list"></ul>
    </div>
    
    <main>
      <div class="results-panel">
        <div class="metric">
          <h3>NOA (Oxyhémoglobine - 414 nm)</h3>
          <p id="val-noa">--</p>
        </div>
        <div class="metric">
          <h3>NBA (Bilirubine - 476 nm)</h3>
          <p id="val-nba">--</p>
        </div>
        <div class="conclusion" id="val-conclusion">
          En attente de données...
        </div>
      </div>

      <div class="chart-container">
        <div id="plotly-div"></div>
      </div>
    </main>
  </div>
  
  <script src="./dist/renderer.js"></script>
</body>
</html>
